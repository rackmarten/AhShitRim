name: build

# Windows minutes bill double on a private repo, so: PRs that touch more than docs (the Windows
# build only once they're out of draft), main only when a cache key's inputs change, and manual runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # A PR can only restore caches saved on its own ref or on main, so main still builds when the
  # vcpkg or plugin_sa cache keys would change. A new MSVC toolset on the runner changes the
  # plugin_sa key too: run the workflow by hand on main then.
  push:
    branches: [main]
    paths:
      - 'skse/vcpkg.json'
      - 'skse/vcpkg-configuration.json'
      - 'protocol/vcpkg.json'
      - 'protocol/vcpkg-configuration.json'
      - 'sa/cmake/plugin_sa.cmake'
      - 'sa/extern/plugin-sdk'
      - 'skse/extern/CommonLibSSE-NG'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The game-free doctest cases on Linux (scripts/test.sh): a quick check next to the Windows build.
  # The link's tests need Windows and run in the build job's scripts/test.ps1.
  protocol-tests-linux:
    # main's runs are only there to save the Windows caches.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Protocol tests
        run: ./scripts/test.sh

  build:
    # A draft PR gets only the Linux tests; marking it ready for review runs this.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    env:
      # vcpkg's binary archives in a known place, so actions/cache can carry them between runs.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create the vcpkg archive folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-archives
          key: vcpkg-${{ hashFiles('skse/vcpkg.json', 'skse/vcpkg-configuration.json', 'protocol/vcpkg.json', 'protocol/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      # CommonLibSSE-NG detects GITHUB_ACTIONS and links its prebuilt release bundle when the
      # submodule sits on a release tag and the MSVC toolset matches; otherwise it builds from source.
      - name: Build SKSE plugin
        shell: pwsh
        run: ./scripts/build.ps1 -Target skse

      # plugin-sdk's plugin_sa is most of the San Andreas build, so its .lib is cached, keyed on the
      # submodule commit, sa/cmake/plugin_sa.cmake and the MSVC toolset. Caching sa/build instead
      # wouldn't help: the checkout gives every file a new mtime, so MSBuild would rebuild it all.
      - name: plugin_sa cache key
        id: plugin-sa
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolset = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $sdk = git -C sa/extern/plugin-sdk rev-parse HEAD
          "key=plugin-sa-$sdk-msvc$toolset-${{ hashFiles('sa/cmake/plugin_sa.cmake') }}" >> $env:GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: plugin-sa-cache
        with:
          path: .plugin-sa
          key: ${{ steps.plugin-sa.outputs.key }}

      - name: Build San Andreas plugin
        shell: pwsh
        run: ./scripts/build.ps1 -Target sa -PluginSaCache .plugin-sa

      # Saved straight away, so a later failing step doesn't cost the next run the plugin_sa build.
      - uses: actions/cache/save@v4
        if: steps.plugin-sa-cache.outputs.cache-hit != 'true'
        with:
          path: .plugin-sa
          key: ${{ steps.plugin-sa.outputs.key }}

      # Game-free doctest cases and the launcher's Pester tests. Without local.props the HUD test
      # against a real San Andreas install skips itself.
      - name: Unit tests
        shell: pwsh
        run: ./scripts/test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AhShitRim-${{ github.sha }}
          path: |
            skse/build/release/AhShitRim.dll
            skse/build/release/AhShitRim.pdb
            sa/build/Release/AhShitRim.asi
            sa/build/Release/AhShitRim.map
          if-no-files-found: error

      # The player release zip (scripts/package.ps1), as its own artifact to install from a PR.
      - name: Release package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AhShitRim-release-${{ github.sha }}
          path: out/release/*.zip
          if-no-files-found: error
