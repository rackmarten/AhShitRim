name: build

# PRs and manual runs build on arcade, a self-hosted Linux runner with the real MSVC under Wine
# (docs/DEV_SETUP.md, "CI"), which costs no Actions minutes. GitHub's windows-latest (billed double
# on a private repo) only runs when asked for by hand, and is the only one that packages the
# release zip.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      windows:
        description: Also build on GitHub's windows-latest (Actions minutes) and package the release zip
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The game-free doctest cases with gcc (scripts/test.sh), as a headless Linux session runs them.
  protocol-tests-linux:
    runs-on: [self-hosted, msvc-wine]
    steps:
      # clean: false keeps the build folders, which the build job below shares with this one.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Protocol tests
        run: ./scripts/test.sh

  # Both plugins and the whole doctest suite (the link's tests too) with MSVC under Wine
  # (scripts/wine/build.sh). The build folders stay on the runner, so most runs are incremental.
  build:
    runs-on: [self-hosted, msvc-wine]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: false

      # A cancelled or timed-out job can leave Wine processes behind.
      - name: Stop leftover Wine processes
        run: WINEPREFIX="$HOME/.wine-msvc" wineserver -k || true

      # cl.exe under Wine now and then spins forever on one file: kill Wine and go again, once.
      # A real compile error fails twice, the second time in seconds.
      - name: Build and test (MSVC under Wine)
        run: |
          timeout -k 30s 45m scripts/wine/build.sh && exit 0
          echo "::warning::scripts/wine/build.sh failed or hung; stopping Wine and running it again"
          WINEPREFIX="$HOME/.wine-msvc" wineserver -k || true
          timeout -k 30s 30m scripts/wine/build.sh

      # Kept short: the account's free artifact storage is small, and a full store must not fail
      # the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: AhShitRim-${{ github.sha }}
          path: |
            skse/build/wine-release/AhShitRim.dll
            sa/build/wine-release/AhShitRim.asi
            sa/build/wine-release/AhShitRim.map
          if-no-files-found: error
          retention-days: 7

  build-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    env:
      # vcpkg's binary archives in a known place, so actions/cache can carry them between runs.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create the vcpkg archive folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-archives
          key: vcpkg-${{ hashFiles('skse/vcpkg.json', 'skse/vcpkg-configuration.json', 'protocol/vcpkg.json', 'protocol/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      # CommonLibSSE-NG detects GITHUB_ACTIONS and links its prebuilt release bundle when the
      # submodule sits on a release tag and the MSVC toolset matches; otherwise it builds from source.
      - name: Build SKSE plugin
        shell: pwsh
        run: ./scripts/build.ps1 -Target skse

      # plugin-sdk's plugin_sa is most of the San Andreas build, so its .lib is cached, keyed on the
      # submodule commit, sa/cmake/plugin_sa.cmake and the MSVC toolset. Caching sa/build instead
      # wouldn't help: the checkout gives every file a new mtime, so MSBuild would rebuild it all.
      - name: plugin_sa cache key
        id: plugin-sa
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolset = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $sdk = git -C sa/extern/plugin-sdk rev-parse HEAD
          "key=plugin-sa-$sdk-msvc$toolset-${{ hashFiles('sa/cmake/plugin_sa.cmake') }}" >> $env:GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: plugin-sa-cache
        with:
          path: .plugin-sa
          key: ${{ steps.plugin-sa.outputs.key }}

      - name: Build San Andreas plugin
        shell: pwsh
        run: ./scripts/build.ps1 -Target sa -PluginSaCache .plugin-sa

      # Saved straight away, so a later failing step doesn't cost the next run the plugin_sa build.
      - uses: actions/cache/save@v4
        if: steps.plugin-sa-cache.outputs.cache-hit != 'true'
        with:
          path: .plugin-sa
          key: ${{ steps.plugin-sa.outputs.key }}

      # Game-free doctest cases and the launcher's Pester tests. Without local.props the HUD test
      # against a real San Andreas install skips itself.
      - name: Unit tests
        shell: pwsh
        run: ./scripts/test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AhShitRim-windows-${{ github.sha }}
          path: |
            skse/build/release/AhShitRim.dll
            skse/build/release/AhShitRim.pdb
            sa/build/Release/AhShitRim.asi
            sa/build/Release/AhShitRim.map
          if-no-files-found: error

      # The player release zip (scripts/package.ps1), as its own artifact to install from a PR.
      - name: Release package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AhShitRim-release-${{ github.sha }}
          path: out/release/*.zip
          if-no-files-found: error
